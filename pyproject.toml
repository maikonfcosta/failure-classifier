[project]
name = "failure-classifier"
version = "0.1.0"
description = "Tells whether a failed Playwright test means a product bug, an environment outage or an outdated test."
authors = [
    { name = "Maikon Costa", email = "maikonfcosta@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
failure-classifier = "failure_classifier.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.8",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["failure_classifier"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
